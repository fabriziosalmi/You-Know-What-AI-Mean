name: Build & deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CNAME'
      - 'favicon.ico'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Build site
        run: |
          mkdir -p _site
          # Without an explicit lang, pandoc emits <html lang="" xml:lang="">.
          # An empty lang is worse than none: it declares that the page has no
          # language, so a screen reader falls back to the user's own voice
          # settings and reads English prose with the wrong phonetics
          # (WCAG 2.1 SC 3.1.1, Language of Page).
          pandoc README.md -s -o _site/index.html \
            --metadata pagetitle="You Know What AI Mean" \
            --metadata lang=en \
            --include-in-header=docs-assets/pandoc-head.html \
            --include-after-body=docs-assets/pandoc-footer.html
          [ -f favicon.ico ] && cp favicon.ico _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
